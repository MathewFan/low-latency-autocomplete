name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run evaluate
      - name: Scale workload smoke test
        run: npm run benchmark:scale
        env:
          BENCH_RECORDS: 1000
          BENCH_SECONDS: 1
          BENCH_CONNECTIONS: 4
